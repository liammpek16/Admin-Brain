<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADMIN BRAIN // HUD</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="bar">
    <span class="brand">ADMIN&nbsp;BRAIN <span class="dim">// HUD</span></span>
    <span class="dim" id="meta">loading…</span>
    <button id="refresh" class="btn">↻ refresh</button>
  </header>

  <main class="grid">
    <section class="panel" id="glance">
      <h2>PORTFOLIO</h2>
      <div class="glance-nums" id="glance-nums"></div>
      <div class="health" id="glance-health"></div>
      <p class="summary" id="summary"></p>
    </section>

    <section class="panel" id="attention">
      <h2>NEEDS ATTENTION</h2>
      <ul id="attention-list"><li class="dim">…</li></ul>
    </section>

    <section class="panel" id="focus">
      <h2>FOCUS TODAY</h2>
      <ol id="focus-list"><li class="dim">…</li></ol>
    </section>

    <section class="panel wide" id="projects">
      <h2>PROJECTS</h2>
      <div class="proj-head"><span>project</span><span>pri</span><span>next</span><span>activity</span></div>
      <div id="projects-list"></div>
    </section>

    <section class="panel" id="trends">
      <h2>TRENDS
        <select id="metric" class="sel">
          <option value="projects_active">projects_active</option>
          <option value="projects_planned">projects_planned</option>
          <option value="needs_attention">needs_attention</option>
          <option value="health_green">health_green</option>
          <option value="avg_days_since">avg_days_since</option>
          <option value="projects_total">projects_total</option>
        </select>
      </h2>
      <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
      <p class="trend-note dim" id="trend-note"></p>
    </section>

    <section class="panel" id="deck">
      <h2>COMMAND DECK</h2>
      <div class="deck-btns">
        <button class="btn run" data-skill="brief">brief</button>
        <button class="btn run" data-skill="metrics">metrics</button>
        <button class="btn run" data-skill="inbox">inbox</button>
      </div>
      <pre class="log" id="deck-log">idle. run a skill — output appears here.</pre>
    </section>
  </main>

  <footer class="foot dim">deterministic · $0 · local (127.0.0.1) · no LLM</footer>
  <script src="/app.js"></script>
</body>
</html>
